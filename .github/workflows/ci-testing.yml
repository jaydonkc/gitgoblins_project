name: CI Testing

on:
  push:
    branches: [main, TE6_branch]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
