name: CI Testing

on:
  push:
    branches: [main, TE6_branch]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test:e2e:stories
      - run: npm test

  deploy-backend:
    needs: build
    if: >-
      ${{ github.event_name == 'push' &&
      vars.AZURE_BACKEND_CONFIGURED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.1

      - name: npm install, build, and test
        run: |
          npm install --workspaces=false
          npm run build --if-present
          npm run test --if-present
        working-directory: packages/express-backend

      - name: Zip artifact for deployment
        run: zip ../../release.zip ./* -r
        working-directory: packages/express-backend

      - name: Deploy backend package to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_BACKEND_APP_NAME }}
          publish-profile:
            ${{ secrets.AZURE_BACKEND_PUBLISH_PROFILE }}
          package: release.zip

  deploy-frontend:
    needs: build
    if: >-
      ${{ github.event_name == 'push' &&
      vars.AZURE_STATIC_WEB_APP_CONFIGURED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and deploy frontend
        uses: Azure/static-web-apps-deploy@v1
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        with:
          azure_static_web_apps_api_token:
            ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: "./packages/react-frontend"
          api_location: ""
          output_location: "dist"
