name: Deploy Backend to Azure

on:
  workflow_run:
    workflows: ["CI Testing"]
    types: [completed]
    branches: [main, TE6_branch]

jobs:
  deploy:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
      vars.AZURE_BACKEND_CONFIGURED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.1

      - name: npm install, build, and test
        run: |
          npm install --workspaces=false
          npm run build --if-present
          npm run test --if-present
        working-directory: packages/express-backend

      - name: Zip artifact for deployment
        run: zip ../../release.zip ./* -r
        working-directory: packages/express-backend

      - name: Deploy backend package to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_BACKEND_APP_NAME }}
          publish-profile:
            ${{ secrets.AZURE_BACKEND_PUBLISH_PROFILE }}
          package: release.zip
